services:
  postgres:
    image: postgres:16-alpine
    container_name: equipa-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: equipa
      POSTGRES_PASSWORD: equipa
      POSTGRES_DB: equipa
    volumes:
      - equipa_pgdata:/var/lib/postgresql/data

volumes:
  equipa_pgdata:
